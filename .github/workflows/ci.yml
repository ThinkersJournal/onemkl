name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build + test (Ubuntu, Intel oneAPI MKL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Install Rust without a third-party action so we don't pin
      # to an older Node runtime.
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Cache Intel oneAPI install
        id: cache-oneapi
        uses: actions/cache@v5
        with:
          path: /opt/intel/oneapi
          key: oneapi-mkl-2025.2-${{ runner.os }}

      - name: Install Intel oneAPI MKL
        if: steps.cache-oneapi.outputs.cache-hit != 'true'
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | sudo gpg --dearmor -o /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-mkl-devel

      # bindgen needs libclang on every run, not only on an oneAPI cache miss:
      # ubuntu-latest (26.04) no longer ships it, so a cache hit left it absent.
      - name: Install libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Source oneAPI environment
        run: |
          source /opt/intel/oneapi/setvars.sh
          # Persist the env vars setvars.sh exports so subsequent
          # steps (cargo) can find MKL headers, libs, and the
          # runtime DLLs.
          {
            echo "MKLROOT=$MKLROOT"
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
            echo "CPATH=$CPATH"
            echo "LIBRARY_PATH=$LIBRARY_PATH"
          } >> "$GITHUB_ENV"

      - name: Cache cargo registry + target/
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}

      # Default features already enable every per-domain wrapper
      # plus exactly one of lp64 / threading-sequential / link-dynamic.
      # Don't use --all-features here: lp64 vs ilp64, the three
      # threading layers, and dynamic vs static linking are
      # mutually exclusive and the build script (correctly) rejects
      # the conflicting combinations.
      - name: cargo build
        run: cargo build --workspace

      - name: cargo test
        run: cargo test --workspace --no-fail-fast

      # Single dynamic library (mkl_rt): layers are chosen at run time.
      - name: cargo test (link-rt)
        run: cargo test -p onemkl --no-default-features --features "lp64,threading-sequential,link-rt" --test service_rt

      - name: cargo doc (no warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
      - name: cargo fmt --all --check
        run: cargo fmt --all -- --check

  # Type-checks the whole workspace for the other platforms from a Linux runner
  # (check does not link, and the vendored bindings avoid needing target C
  # headers). Closes the blind spot that let a Windows-only type error
  # (`c_long` is 4 bytes there) reach main: Linux and macOS both have an
  # 8-byte `c_long`.
  cross-check:
    name: cargo check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, x86_64-apple-darwin, aarch64-apple-darwin]
    env:
      ONEMKL_SYS_USE_VENDORED_BINDINGS: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} --no-self-update
      - name: cargo check
        run: cargo check --target ${{ matrix.target }} --workspace --all-targets

  clippy-report-only:
    name: cargo clippy (REPORT-ONLY, not required)
    runs-on: ubuntu-latest
    # Report-only until the 6 remaining too_many_arguments lints are
    # resolved: blas/scalar.rs cblas_tpmv + cblas_tpsv, blas/level2.rs
    # tpmv + tpsv, blas/compact.rs geqrf, pardiso.rs solve_multi.
    # Then this becomes `-D warnings` and required.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update
      - name: Install Intel oneAPI MKL headers and libclang (bindgen)
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB             | sudo gpg --dearmor -o /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main"             | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-mkl-devel libclang-dev
      - name: cargo clippy (lib, report only)
        run: |
          source /opt/intel/oneapi/setvars.sh
          cargo clippy -p onemkl --lib
      - name: Hidden too_many_arguments (source allows overridden, report only)
        run: |
          source /opt/intel/oneapi/setvars.sh
          touch onemkl/src/lib.rs
          n=$(cargo clippy -p onemkl --lib -- --force-warn clippy::too_many_arguments 2>&1 | grep -c 'too many arguments' || true)
          echo "too_many_arguments with the source allows overridden: $n (ROADMAP row W1)" | tee -a "$GITHUB_STEP_SUMMARY"

  # `ilp64` needs bindings generated from the ILP64 headers; the vendored
  # (LP64) bindings must be refused with a clear message, not 689 type errors.
  ilp64-vendored-guard:
    name: ilp64 refuses vendored bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: cargo check must fail with the intended message
        run: |
          if out=$(ONEMKL_SYS_USE_VENDORED_BINDINGS=1 cargo check -p onemkl-sys --no-default-features --features ilp64 2>&1); then
            echo "expected the ilp64 + vendored build to fail"; exit 1
          fi
          echo "$out" | grep -q 'needs bindings generated from the ILP64 headers' || { echo "$out"; exit 1; }

  deny:
    name: cargo deny (advisories, licences, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  # Advisory (ROADMAP row, pm-kernels 2026-11-25): NOT a required check and no rule is silenced here. The called workflow fixes the
  # rule profile and the CodeRipper version; this repository passes nothing.
  portfolio:
    permissions:
      contents: read
    uses: ciresnave/coderipper/.github/workflows/portfolio.yml@467fd259d6d062cba4c5683d310f1a6f2b66e763 # CodeRipper 0.48.1
