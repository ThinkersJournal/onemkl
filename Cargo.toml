[workspace]
resolver = "3"
members = ["onemkl-sys", "onemkl"]

[workspace.package]
version = "0.6.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Eric Evans <ciresnave@gmail.com>"]
repository = "https://github.com/ThinkersJournal/onemkl"
homepage = "https://github.com/ThinkersJournal/onemkl"
keywords = ["mkl", "onemkl", "blas", "lapack", "math"]
categories = ["api-bindings", "mathematics", "science"]

[workspace.dependencies]
onemkl-sys = { path = "onemkl-sys", version = "0.6.1", default-features = false }
num-complex = "0.4"
num-traits = "0.2"
half = { version = "2.7", default-features = false, features = ["num-traits"] }

[profile.release]
lto = "thin"
codegen-units = 1
