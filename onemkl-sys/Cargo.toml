[package]
name = "onemkl-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Raw FFI bindings to the C interface of Intel oneAPI Math Kernel Library (oneMKL)."
readme = "README.md"
links = "mkl"
build = "build.rs"

# docs.rs runs in a sandbox without Intel oneMKL installed. The build
# script detects the `DOCS_RS` env var docs.rs sets and reads the
# vendored `src/vendored_bindings.rs` instead of running bindgen, so
# documentation can build with no MKL toolchain present.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "onemkl_sys"

[features]
default = ["lp64", "threading-sequential", "link-dynamic"]

# --- Interface layer: pick exactly one ---
# 32-bit MKL_INT (default; matches int).
lp64 = []
# 64-bit MKL_INT (long long). Required for arrays > 2^31 elements per dim.
ilp64 = []

# --- Threading layer: pick exactly one ---
# Sequential (no internal threading).
threading-sequential = []
# Intel OpenMP runtime (libiomp5).
threading-intel-openmp = []
# Intel oneAPI Threading Building Blocks.
threading-tbb = []

# --- Linkage: pick exactly one of link-dynamic / link-static / link-rt ---
# Dynamic linking via *_dll.lib import libraries (recommended).
link-dynamic = []
# Static linking against the *.lib archives.
link-static = []
# Single dynamic library (`mkl_rt`): the interface and threading layers are
# chosen at run time. Not compatible with the MPI-dependent domains.
link-rt = []

# --- MPI-dependent domains (opt-in; require MPI on PATH) ---
# Cluster Sparse Solver (Cluster PARDISO). Requires Intel MPI or MS-MPI.
cluster-sparse-solver = []
# Cluster Discrete Fourier Transform.
cdft = []
# ScaLAPACK distributed dense solvers.
scalapack = []
# BLACS communication (transitively required by ScaLAPACK / PBLAS).
blacs = []
# Parallel BLAS (PBLAS). Implies blacs.
pblas = ["blacs"]

[build-dependencies]
# default-features = false drops bindgen's `prettyplease` dep: bindgen allows
# prettyplease >=0.2.7,<0.4 and syn >=2,<4, and a lock that pairs syn 3 with
# prettyplease 0.2 (held there by e.g. prost-build) fails to compile bindgen
# (E0277 ParseQuote). The generated bindings are included unformatted.
# "runtime" makes clang-sys dlopen libclang only when bindgen actually runs;
# without it libclang is linked into the build script, which then fails to
# start (Windows STATUS_DLL_NOT_FOUND 0xc0000135) on machines without libclang,
# including the DOCS_RS path that never calls bindgen.
bindgen = { version = "0.73", default-features = false, features = ["logging", "runtime"] }
